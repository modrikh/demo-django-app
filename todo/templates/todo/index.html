<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Demo Django - Qualification DevSecOps</title>
    <style>
        body { font-family: sans-serif; max-width: 50rem; margin: 2rem auto; color: #222; }
        form { margin: 1rem 0; }
        input[type=text] { padding: 0.4rem; width: 60%; }
        button { padding: 0.4rem 1rem; }
        ul { padding-left: 1.2rem; }
        .done { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
    <h1>Application de demo (todo)</h1>
    <p>Projet cible de la plateforme de qualification DevSecOps.</p>
    <form method="post" action="{% url 'todo:add' %}">
        {% csrf_token %}
        <label for="title">Nouvelle tache</label>
        <input type="text" id="title" name="title" placeholder="Nouvelle tache" required>
        <button type="submit">Ajouter</button>
    </form>
    {% if items %}
    <ul>
        {% for item in items %}
        <li class="{% if item.done %}done{% endif %}">{{ item.title }}</li>
        {% endfor %}
    </ul>
    {% else %}
    <p>Aucune tache pour le moment.</p>
    {% endif %}
    <p><small><a href="{% url 'todo:health' %}">Etat de l'API</a></small></p>
</body>
</html>
